<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozmopolita Energy</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body>

    <div id="map"></div>

    <button id="toggle-city-list" aria-label="Buscar Cidade">🔍</button>

    <div class="watermark">
        <div class="logo-circle"></div>
        contato: cozmopolitaenergy@gmail.com <br>lightning: bronzeddrill943@walletofsatoshi.com</br></div>
    </div>

    <div class="city-list" id="city-list-container">
        <div class="city-list-header">
            <h3>Cidades</h3>
            <button id="close-city-list" aria-label="Fechar">&times;</button>
        </div>

        <input
            type="text"
            id="search-city"
            placeholder="Pesquisar cidade..."
        >

        <ul id="city-list">
        </ul>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        let precos = {};

        const map = L.map('map').setView([-14.2350, -51.9253], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const markers = {};
        let initialZoomSet = false;

        const cityList = document.getElementById("city-list");
        const searchInput = document.getElementById("search-city");
        const cityListContainer = document.getElementById("city-list-container");
        const toggleCityListBtn = document.getElementById("toggle-city-list");
        const closeCityListBtn = document.getElementById("close-city-list");

        function renderCities(search = "") {
            cityList.innerHTML = "";

            Object.keys(precos)
                .filter(cidade =>
                    cidade.toLowerCase().includes(search.toLowerCase())
                )
                .forEach(cidade => {
                    const li = document.createElement("li");
                    li.textContent = cidade;

                    li.addEventListener("click", () => {
                        const { lat, lon } = precos[cidade];

                        if (!initialZoomSet) {
                            map.setView([lat, lon], 7);
                            initialZoomSet = true;
                        } else {
                            map.setView([lat, lon]);
                        }

                        markers[cidade].openPopup();

                        // Fecha a lista no celular ao clicar em uma cidade
                        cityListContainer.classList.remove("active");
                    });

                    cityList.appendChild(li);
                });
        }

        searchInput.addEventListener("input", (e) => {
            renderCities(e.target.value);
        });

        // Eventos para abrir/fechar a lista de cidades no celular
        toggleCityListBtn.addEventListener("click", () => {
            cityListContainer.classList.add("active");
        });

        closeCityListBtn.addEventListener("click", () => {
            cityListContainer.classList.remove("active");
        });

        function normalizarTexto(texto) {
            return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
        }

        function formatarData(data) {
            if (!data) return 'Não informada';
            const [ano, mes, dia] = data.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        // Carrega coordenadas e tarifas geradas no build.
        Promise.all([
            fetch('./precos.json').then(response => response.json()),
            fetch('./dados-tarifas.json')
                .then(response => response.ok ? response.json() : { tarifas: [] })
                .catch(() => ({ tarifas: [] }))
        ])
            .then(([data, tarifasData]) => {
                const tarifas = tarifasData.tarifas || [];
                const tarifaAtualizada = tarifas.find(tarifa =>
                    tarifa.subGrupo === 'B1' &&
                    tarifa.classe === 'Residencial' &&
                    tarifa.modalidadeTarifaria === 'Convencional'
                );
                // Filtra cidades com preços cadastrados (> 0)
                for (const [cidade, dados] of Object.entries(data)) {
                    const precoAtualizado = tarifaAtualizada?.tarifaTotalRsPorKwh;
                    const preco = precoAtualizado ?? dados.preco;
                    if (preco > 0) {
                        precos[cidade] = { ...dados, preco, tarifa: tarifaAtualizada };
                    }
                }

                for (const [cidade, dados] of Object.entries(precos)) {
                    const { preco, lat, lon } = dados;
                    const tarifa = dados.tarifa;
                    const consumoCarro = 60;
                    const custoCarregamento = (consumoCarro * preco).toFixed(2);
                    const detalhesTarifa = tarifa ? `
                            <strong>Modalidade tarifária:</strong> ${tarifa.modalidadeTarifaria}<br>
                            <strong>Subgrupo:</strong> ${tarifa.subGrupo}<br>
                            <strong>Classe:</strong> ${tarifa.classe}<br>
                            <strong>Início da vigência:</strong> ${formatarData(tarifa.inicioVigencia)}<br>
                            <strong>Fim da vigência:</strong> ${formatarData(tarifa.fimVigencia)}<br>
                        ` : '';

                    markers[cidade] = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`
                            <strong>${cidade}</strong><br>
                            <strong>Valor da tarifa:</strong> R$${preco.toFixed(2)}/kWh<br>
                            ${detalhesTarifa}
                            <strong>Custo para carregar um carro elétrico:</strong> R$${custoCarregamento}
                        `);
                }

                renderCities();
            })
            .catch(error => console.error('Erro ao carregar dados de preços:', error));
    </script>

</body>

</html>
