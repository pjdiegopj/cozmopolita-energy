<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Cozmopolita Energy</title>
  <meta name="theme-color" content="#5dade2">
  <style>
    :root {
      --bg: #0b1220;
      --panel: #122033;
      --primary: #5dade2;
      --text: #eaf2ff;
      --muted: #a8bed8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0b1220, #16273d);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 560px;
      width: 100%;
      padding: 40px 28px;
      border-radius: 20px;
      background: rgba(18, 32, 51, 0.92);
      border: 1px solid rgba(93, 173, 226, 0.25);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(93, 173, 226, 0.14);
      color: var(--primary);
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
      font-size: 1.05rem;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      background: var(--primary);
      color: #071319;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Offline</div>
    <h1>Cozmopolita Energy</h1>
    <p>Você está sem conexão no momento. Assim que a internet voltar, a página será sincronizada automaticamente.</p>
    <a href="/">Voltar para a página inicial</a>
  </main>
</body>
</html>
